name: CI

on:
  push:
    branches: [ main, "arena/**" ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install numpy scipy rasterio scikit-learn pytest
      - name: Run test suite
        run: |
          pytest -v tests/
      - name: Validate primary submission format
        run: |
          python scripts/validate_submission.py downloads/submission.tif
