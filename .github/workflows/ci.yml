name: 8GEMSDOE CI (no competition data needed)
on:
  push:
    branches: [main, arena/*]
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: PYTHONPATH=src python -m pytest tests/ -q
      - run: PYTHONPATH=src python scripts/validate_submission.py --self-test
      - run: PYTHONPATH=src python scripts/holdout_validate.py --fixture --report /tmp/holdout.json
      - run: PYTHONPATH=src python scripts/build_submission.py --demo --out /tmp/subs && ls /tmp/subs
