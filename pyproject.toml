[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gemsdoe"
version = "0.1.0"
description = "8GEMSDOE Geothermal Fault Discovery & Submission Pipeline"
authors = [{ name = "buffedlizard55-lab" }]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "rasterio>=1.3",
    "scikit-learn>=1.2",
    "pytest>=7.0",
]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]
